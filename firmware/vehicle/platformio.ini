; 스낵 익스프레스 차량 펌웨어 (ESP32-C3 슈퍼미니)
; gateway(cockpit) 서버에 직접 접속하는 독립 두뇌. M5 비의존 순수 Arduino.
;
; 빌드:  pio run -e esp32-c3
; 업로드: pio run -e esp32-c3 -t upload --upload-port /dev/tty.usbmodemXXXX

[env:esp32-c3]
; arduino-esp32 2.0.9(espressif32 6.3.2). LEDC는 채널 기반 API(ledcSetup/ledcAttachPin).
; 3.x로 올리면 핀 기반 API로 바뀌므로 drive.cpp가 ESP_ARDUINO_VERSION_MAJOR로 분기한다.
platform = espressif32@6.3.2
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	; C3 슈퍼미니: 로그를 USB 시리얼(USB-Serial/JTAG)로 출력. C3는 두 플래그 모두 필요
	; (USB_MODE=1: 내장 USB-Serial/JTAG(HWCDC) 사용, CDC_ON_BOOT=1: Serial을 USB로 매핑).
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7
